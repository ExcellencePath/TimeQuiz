<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم — اختبار السكرتارية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080e; --surface:#0c1220; --card:#10192c; --card2:#152034;
  --border:#1c2b41; --accent:#f59e0b; --blue:#3b82f6;
  --danger:#ef4444; --success:#10b981; --purple:#8b5cf6;
  --text:#e2e8f0; --muted:#64748b; --muted2:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;}

/* ── HEADER ── */
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
}
.header-left{display:flex;align-items:center;gap:.7rem;flex:1;}
.header h1{font-family:'Tajawal',sans-serif;font-size:1.2rem;font-weight:900;color:var(--accent);}
.live-pill{display:inline-flex;align-items:center;gap:.38rem;background:var(--success);
  color:#fff;border-radius:20px;padding:.22rem .65rem;font-size:.73rem;font-weight:700;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.header-actions{display:flex;gap:.6rem;align-items:center;}
.btn-icon{background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted2);
  padding:.38rem .75rem;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.8rem;font-weight:700;transition:all .2s;}
.btn-icon:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{border-color:#ef444444;color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.last-refresh{color:var(--muted);font-size:.75rem;}

/* ── BODY ── */
.dash-body{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:1.8rem 1.5rem 3rem;}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
.stat-val{font-family:'Tajawal',sans-serif;font-size:2.1rem;font-weight:900;margin-bottom:.18rem;}
.stat-lbl{color:var(--muted2);font-size:.77rem;font-weight:600;}
.c-blue{color:var(--blue);}.c-green{color:var(--success);}.c-red{color:var(--danger);}.c-acc{color:var(--accent);}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.5rem;}
.tbl-head{
  display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 1fr;
  padding:.65rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--border);
  font-size:.75rem;font-weight:700;color:var(--muted2);
}
.stu-row{
  display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 1fr;
  padding:.78rem 1.2rem;border-bottom:1px solid var(--border);align-items:center;
  cursor:pointer;transition:background .18s;
}
.stu-row:last-child{border-bottom:none;}
.stu-row:hover{background:var(--card2);}
.stu-name{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:.5rem;}
.score-pill{display:inline-flex;align-items:center;justify-content:center;
  min-width:48px;padding:.2rem .5rem;border-radius:20px;font-size:.79rem;font-weight:900;}
.pill-hi{background:#052e16;color:var(--success);border:1px solid #10b98133;}
.pill-md{background:#451a03;color:var(--accent);border:1px solid #f59e0b33;}
.pill-lo{background:#450a0a;color:var(--danger);border:1px solid #ef444433;}
.rtag{font-size:.69rem;padding:.1rem .4rem;border-radius:5px;font-weight:700;}
.r-exit{background:#1e2d4a;color:var(--blue);}
.r-manual{background:#052e16;color:var(--success);}
.r-time{background:#450a0a;color:var(--danger);}
.cell-muted{font-size:.83rem;color:var(--muted2);}
.empty-state{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
.empty-state .empty-icon{font-size:2.5rem;margin-bottom:.7rem;}
.empty-state p{font-size:.9rem;line-height:1.7;}

/* ── DRAWER ── */
.drawer-overlay{display:none;position:fixed;inset:0;background:#00000099;backdrop-filter:blur(4px);
  z-index:200;align-items:flex-end;justify-content:center;padding:1rem;}
.drawer-overlay.open{display:flex;}
.drawer{background:var(--card);border:1px solid var(--border);border-radius:18px 18px 12px 12px;
  width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:1.5rem;}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.drawer-title{font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:900;}
.drawer-meta{color:var(--muted2);font-size:.8rem;margin-bottom:1.1rem;padding-bottom:.8rem;border-bottom:1px solid var(--border);}
.drawer-close{background:transparent;border:1.5px solid var(--border);border-radius:7px;color:var(--muted2);
  width:27px;height:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:.9rem;transition:all .18s;}
.drawer-close:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.ans-item{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;
  padding:.7rem .9rem;margin-bottom:.55rem;font-size:.84rem;}
.ans-item.correct{border-color:#10b98133;background:#052e1615;}
.ans-item.wrong{border-color:#ef444433;background:#450a0a15;}
.ans-item.skipped{border-color:#f59e0b33;background:#451a0315;}
.ans-q{font-weight:700;margin-bottom:.35rem;color:var(--text);line-height:1.55;}
.ans-tags{display:flex;gap:.5rem;flex-wrap:wrap;}
.tag{font-size:.74rem;font-weight:700;padding:.12rem .45rem;border-radius:5px;}
.tag-mine{background:#1e3a5f;color:var(--blue);}
.tag-correct{background:#052e16;color:var(--success);}
.tag-skip{background:#451a03;color:var(--accent);}

/* ── EXPORT BAR ── */
.export-bar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem;}
.export-bar span{color:var(--muted2);font-size:.8rem;}

::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .tbl-head,.stu-row{grid-template-columns:2fr 1fr 1fr;}
  .tbl-head span:nth-child(4),.tbl-head span:nth-child(5),
  .stu-row>span:nth-child(4),.stu-row>span:nth-child(5){display:none;}
  .dash-body{padding:1.3rem 1rem 3rem;}
  .header{padding:.8rem 1rem;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>📊 لوحة المعلم — اختبار السكرتارية</h1>
    <span class="live-pill"><span class="live-dot"></span>مباشر</span>
  </div>
  <div class="header-actions">
    <span class="last-refresh" id="last-refresh">—</span>
    <button class="btn-icon" onclick="loadResults()">🔄 تحديث</button>
    <button class="btn-icon" onclick="exportCSV()">⬇ تصدير CSV</button>
    <button class="btn-icon btn-danger" onclick="clearAll()">🗑 مسح الكل</button>
  </div>
</div>

<div class="dash-body">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val c-blue" id="st-total">0</div><div class="stat-lbl">إجمالي الطلاب</div></div>
    <div class="stat-card"><div class="stat-val c-acc" id="st-avg">—</div><div class="stat-lbl">متوسط الدرجات</div></div>
    <div class="stat-card"><div class="stat-val c-green" id="st-pass">0</div><div class="stat-lbl">ناجح (%60+)</div></div>
    <div class="stat-card"><div class="stat-val c-red" id="st-fail">0</div><div class="stat-lbl">يحتاج مراجعة</div></div>
  </div>

  <!-- EXPORT -->
  <div class="export-bar">
    <span>اضغط على اسم الطالب لمشاهدة إجاباته التفصيلية</span>
  </div>

  <!-- TABLE -->
  <div class="tbl-wrap">
    <div class="tbl-head">
      <span>الطالب</span>
      <span>الدرجة</span>
      <span>صح / خطأ</span>
      <span>وقت التسليم</span>
      <span>التسليم</span>
    </div>
    <div id="students-list">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <p>في انتظار تسليم الطلاب...<br><small>تتحدث اللوحة كل 5 ثوانٍ تلقائياً</small></p>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="maybeClose(event)">
  <div class="drawer">
    <div class="drawer-top">
      <div class="drawer-title" id="d-title">تفاصيل الطالب</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-meta" id="d-meta"></div>
    <div id="d-body"></div>
  </div>
</div>

<script>
const STORE_KEY = 'exam_results';
let allResults = [];
let autoRefresh;

// ═══════════════════════════════════
// LOAD from shared storage
// ═══════════════════════════════════
async function loadResults() {
  try {
    let raw = null;
    if (window.storage) {
      const res = await window.storage.get(STORE_KEY, true); // shared=true
      raw = res ? res.value : null;
    }
    if (!raw) raw = localStorage.getItem(STORE_KEY);
    allResults = raw ? JSON.parse(raw) : [];
  } catch(e) {
    try { allResults = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch(e2){ allResults=[]; }
  }
  render();
  document.getElementById('last-refresh').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA');
}

// ═══════════════════════════════════
// RENDER TABLE
// ═══════════════════════════════════
function render() {
  const list = document.getElementById('students-list');
  const r = allResults;

  if (!r.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">⏳</div><p>في انتظار تسليم الطلاب...<br><small>تتحدث اللوحة كل 5 ثوانٍ تلقائياً</small></p></div>`;
    ['st-total','st-avg','st-pass','st-fail'].forEach(id => document.getElementById(id).textContent = id==='st-avg'?'—':'0');
    return;
  }

  const total = r.length;
  const avg = Math.round(r.reduce((s,x)=>s+x.pct,0)/total);
  const pass = r.filter(x=>x.pct>=60).length;
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-avg').textContent = avg+'%';
  document.getElementById('st-pass').textContent = pass;
  document.getElementById('st-fail').textContent = total-pass;

  list.innerHTML = r.map((s,i) => {
    const pc = s.pct>=80?'pill-hi':s.pct>=60?'pill-md':'pill-lo';
    const rc = {exit:'r-exit',manual:'r-manual',time:'r-time'}[s.reason]||'r-exit';
    const rl = {exit:'⚡ خروج',manual:'✅ يدوي',time:'⏰ وقت'}[s.reason]||'—';
    const m=Math.floor(s.elapsed/60), sec=s.elapsed%60;
    const time = s.submittedAt || `${m}د ${sec}ث`;
    return `<div class="stu-row" onclick="openDrawer(${i})">
      <span class="stu-name">👤 ${esc(s.name)}</span>
      <span><span class="score-pill ${pc}">${s.pct}%</span></span>
      <span class="cell-muted">${s.correct}✓  ${s.wrong}✗</span>
      <span class="cell-muted" style="font-size:.76rem">${time}</span>
      <span><span class="rtag ${rc}">${rl}</span></span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════
// DRAWER
// ═══════════════════════════════════
function openDrawer(idx) {
  const s = allResults[idx]; if(!s) return;
  document.getElementById('d-title').textContent = '👤 '+s.name+' — '+s.pct+'%';
  const m=Math.floor(s.elapsed/60),sec=s.elapsed%60;
  document.getElementById('d-meta').innerHTML =
    `الدرجة: <strong style="color:var(--accent)">${s.pct}%</strong> &nbsp;|&nbsp; `+
    `صح: <strong style="color:var(--success)">${s.correct}</strong> &nbsp;|&nbsp; `+
    `خطأ: <strong style="color:var(--danger)">${s.wrong}</strong> &nbsp;|&nbsp; `+
    `لم يُجَب: <strong style="color:var(--accent)">${s.skipped}</strong> &nbsp;|&nbsp; `+
    `الوقت: <strong>${m}د ${sec}ث</strong><br>`+
    `وقت التسليم: <strong>${s.submittedAt||'—'}</strong>`;
  document.getElementById('d-body').innerHTML = (s.detail||[]).map((d,i) =>
    `<div class="ans-item ${d.status}">
      <div class="ans-q">${i+1}. ${esc(d.q)}</div>
      <div class="ans-tags">
        <span class="tag tag-mine">إجابته: ${esc(d.my||'—')}</span>
        <span class="tag tag-correct">الصحيحة: ${esc(d.correct||'—')}</span>
        ${d.status==='skipped'?'<span class="tag tag-skip">لم يُجَب</span>':''}
      </div>
    </div>`).join('');
  document.getElementById('drawer-overlay').classList.add('open');
}
function maybeClose(e){ if(e.target===document.getElementById('drawer-overlay')) closeDrawer(); }
function closeDrawer(){ document.getElementById('drawer-overlay').classList.remove('open'); }

// ═══════════════════════════════════
// EXPORT CSV
// ═══════════════════════════════════
function exportCSV() {
  if (!allResults.length) { alert('لا توجد نتائج للتصدير'); return; }
  let csv = '\uFEFF'; // BOM for Arabic
  csv += 'الاسم,الدرجة,صح,خطأ,لم يُجب,الوقت (ث),طريقة التسليم,وقت التسليم\n';
  allResults.forEach(s => {
    const rl = {exit:'خروج تلقائي',manual:'تسليم يدوي',time:'انتهاء الوقت'}[s.reason]||s.reason;
    csv += `"${s.name}",${s.pct}%,${s.correct},${s.wrong},${s.skipped},${s.elapsed},"${rl}","${s.submittedAt||''}"\n`;
  });
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='نتائج_الاختبار.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ═══════════════════════════════════
// CLEAR
// ═══════════════════════════════════
async function clearAll() {
  if(!confirm('تأكيد مسح جميع نتائج الطلاب؟')) return;
  try {
    if(window.storage) await window.storage.delete(STORE_KEY, true);
    localStorage.removeItem(STORE_KEY);
  } catch(e) { localStorage.removeItem(STORE_KEY); }
  allResults = [];
  render();
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════
// AUTO REFRESH every 5s
// ═══════════════════════════════════
loadResults();
autoRefresh = setInterval(loadResults, 5000);
</script>
</body>
</html>
